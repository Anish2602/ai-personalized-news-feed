name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newsfeed
          POSTGRES_PASSWORD: newsfeed
          POSTGRES_DB: newsfeed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U newsfeed"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://newsfeed:newsfeed@localhost:5432/newsfeed
      TEST_DATABASE_URL: postgresql+psycopg://newsfeed:newsfeed@localhost:5432/newsfeed
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret
      NEWS_RSS_FEEDS: '["https://example.com/rss"]'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU torch first to keep it light)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: mypy
        run: mypy app || true   # advisory until types are fully annotated

      - name: Alembic migrations apply cleanly
        run: alembic upgrade head

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing
