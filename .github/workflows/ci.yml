name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.7" mypy
      - name: Ruff lint
        run: ruff check app tests scripts
      - name: Ruff format
        run: ruff format --check app tests scripts
      - name: mypy (advisory)
        run: mypy app || true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newsfeed
          POSTGRES_PASSWORD: newsfeed
          POSTGRES_DB: newsfeed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U newsfeed"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports: ["6333:6333"]

    env:
      DATABASE_URL: postgresql+psycopg://newsfeed:newsfeed@localhost:5432/newsfeed
      TEST_DATABASE_URL: postgresql+psycopg://newsfeed:newsfeed@localhost:5432/newsfeed_test
      TEST_QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-long-enough
      NEWS_RSS_FEEDS: '["https://example.com/rss"]'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU torch first to keep it light)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          pip install -e ".[dev]"

      - name: Create the test database
        run: PGPASSWORD=newsfeed psql -h localhost -U newsfeed -d newsfeed -c 'CREATE DATABASE newsfeed_test;'

      - name: Alembic migrations apply cleanly
        run: alembic upgrade head

      - name: No model / migration drift
        run: alembic check

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
