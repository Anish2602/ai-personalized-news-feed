global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: news-feed-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { component: api }

  - job_name: news-feed-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
        labels: { component: worker }
